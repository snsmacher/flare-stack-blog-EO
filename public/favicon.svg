<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Doraemon">
  <title>Doraemon</title>
  <defs>
    <clipPath id="badge">
      <circle cx="64" cy="64" r="63"/>
    </clipPath>
    <clipPath id="head">
      <ellipse cx="64" cy="48" rx="34.5" ry="33.5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="128" height="128" fill="#1B9FE0"/>

    <!-- 身体 / 肩膀 -->
    <ellipse cx="64" cy="122" rx="34" ry="30" fill="#1B9FE0" stroke="#16181D" stroke-width="3.2"/>

    <!-- 项圈 -->
    <path d="M30 71h68v12a34 9.5 0 0 1-68 0z" fill="#E8312B" stroke="#16181D" stroke-width="3"/>
    <path d="M30 71h68" stroke="#16181D" stroke-width="3"/>

    <!-- 铃铛 -->
    <circle cx="64" cy="92" r="10" fill="#F5CE3E" stroke="#16181D" stroke-width="3"/>
    <path d="M54 92h20" stroke="#16181D" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="64" cy="97" r="2.1" fill="#16181D"/>
    <circle cx="64" cy="85.5" r="1.6" fill="#16181D"/>

    <!-- 头部 -->
    <ellipse cx="64" cy="48" rx="34.5" ry="33.5" fill="#1B9FE0" stroke="#16181D" stroke-width="3.4"/>

    <g clip-path="url(#head)">
      <!-- 脸部 -->
      <ellipse cx="64" cy="58" rx="31.5" ry="23.5" fill="#FFFFFF"/>

      <!-- 胡须 -->
      <g stroke="#16181D" stroke-width="2.4" stroke-linecap="round">
        <path d="M45 46 33 41"/>
        <path d="M43.5 54.5 31 54.5"/>
        <path d="M45 63 33 68"/>
        <path d="M83 46 95 41"/>
        <path d="M84.5 54.5 97 54.5"/>
        <path d="M83 63 95 68"/>
      </g>
    </g>

    <!-- 眼睛 -->
    <g stroke="#16181D" stroke-width="3" >
      <ellipse cx="51.5" cy="33.5" rx="10.8" ry="12.6" fill="#FFFFFF"/>
      <ellipse cx="76.5" cy="33.5" rx="10.8" ry="12.6" fill="#FFFFFF"/>
    </g>
    <g fill="#16181D">
      <circle cx="54.4" cy="35.4" r="4.4"/>
      <circle cx="79.6" cy="35.4" r="4.4"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="55.9" cy="33.6" r="1.45"/>
      <circle cx="81.1" cy="33.6" r="1.45"/>
    </g>

    <!-- 鼻子 -->
    <circle cx="64" cy="52" r="8.2" fill="#E8312B" stroke="#16181D" stroke-width="2.8"/>
    <circle cx="61.3" cy="49.3" r="2.2" fill="#FFFFFF" opacity=".9"/>

    <!-- 嘴 -->
    <g stroke="#16181D" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M64 60.2v5.4"/>
      <path d="M64 65.6c0 5.4-4.4 9-9.6 7.1"/>
      <path d="M64 65.6c0 5.4 4.4 9 9.6 7.1"/>
    </g>
  </g>
</svg>
